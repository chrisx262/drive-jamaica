<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Drive Jamaica</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #87ceeb; }
      #app { width: 100%; height: 100%; }
      #hud {
        position: fixed; top: 12px; left: 12px; color: #fff;
        font-family: system-ui, sans-serif; font-weight: 700;
        text-shadow: 0 1px 3px rgba(0,0,0,0.6); user-select: none;
      }
      #callout {
        position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
        padding: 6px 16px; border-radius: 6px;
        background: #007749; color: #fed100; border: 2px solid #fed100;
        font-family: system-ui, sans-serif; font-weight: 800; font-size: 18px;
        opacity: 0; transition: opacity 0.3s; user-select: none;
      }
      /* Frustration meter (top-right) — hidden until the meter starts charging */
      #frustration-wrap {
        position: fixed; top: 12px; right: 12px;
        display: flex; flex-direction: column; align-items: flex-end; gap: 3px;
        opacity: 0; transition: opacity 0.4s; user-select: none;
      }
      #frustration-label {
        font-family: system-ui, sans-serif; font-weight: 700; font-size: 12px;
        color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.7);
        letter-spacing: 0.03em;
      }
      #frustration-track {
        width: 110px; height: 10px;
        background: rgba(0,0,0,0.35); border-radius: 5px; overflow: hidden;
        border: 1px solid rgba(255,255,255,0.25);
      }
      #frustration-fill {
        height: 100%; width: 0%;
        background: #f26522;
        border-radius: 5px;
        transition: width 0.15s linear, background 0.3s;
      }
      #frustration-wrap.ready #frustration-fill {
        animation: pulse-orange 0.6s ease-in-out infinite alternate;
      }
      #frustration-wrap.truck-active #frustration-fill {
        background: #ff3300;
      }
      @keyframes pulse-orange {
        from { opacity: 0.7; }
        to   { opacity: 1; box-shadow: 0 0 8px 2px #f26522; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud"></div>
    <div id="callout"></div>
    <div id="frustration-wrap">
      <div id="frustration-label">😤 PRESS H</div>
      <div id="frustration-track">
        <div id="frustration-fill"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
